# ForgeEngine.framework identity. Tracked on purpose: nothing here is
# machine- or developer-specific (no bundle id of a signed app, no team).
framework.name=ForgeEngine
framework.id=com.economydraft.forgeengine
framework.version=0.1
framework.build=1

# Read by forge-gui-ios/pipeline/ios-pipeline.sh (shared with the full game
# build); a framework has no executable or main class of its own.
app.id=com.economydraft.forgeengine
app.executable=ForgeEngine
app.mainclass=forge.ios.engine.ForgeEngineImpl
app.name=ForgeEngine
app.version=0.1
app.build=1
